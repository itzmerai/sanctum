name: build-windows

# Windows is the only v1 target (KTD6) and the build runs on a real Windows
# host from day one (KTD19) -- WSL cross-compilation is not a supported path
# for the Tauri bundler.
# Only the default branch on push. A branch with an open PR would otherwise
# fire both triggers and run every check twice, which clutters the PR's status
# list and makes a finishing second run look like a stuck first one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (frontend + Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Verification Contract: frontend
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Frontend tests
        run: npm run test

      # Verification Contract: Rust. The crypto property and fault-injection
      # tests are mandatory gates, so a failure here fails the build.
      - name: Rust format
        run: cargo fmt --all --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test --all-features
        working-directory: src-tauri

  bundle:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Authenticode signing (U22, R3). Runs only when the secrets exist, so
      # forks and ordinary branch pushes still produce an unsigned installer
      # rather than failing. See docs/packaging.md.
      - name: Import signing certificate
        id: signing
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sanctum-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfxPath -Force

          # Patch the thumbprint in rather than committing it: which key is
          # authoritative is a deployment fact, not a source fact.
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: npm run tauri build

      - name: Report signature status
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "installer : $($installer.Name)"
          Write-Host "size      : $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "signature : $($signature.Status)"
          if ($signature.Status -ne 'Valid') {
            Write-Warning 'Installer is unsigned. Windows SmartScreen will warn on first run. See docs/packaging.md.'
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sanctum-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
