[package]
name = "sanctum"
version = "0.1.0"
description = "Local-first, end-to-end encrypted vault for credentials, notes, tasks, calendar and income."
authors = ["Sanctum"]
edition = "2021"
rust-version = "1.77.2"

# The library target is what the integration tests and the binary both link
# against, so command logic stays testable without launching a window.
[lib]
name = "sanctum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- crypto core (U2) -------------------------------------------------------
# Argon2id KDF, AES-256-GCM AEAD, and explicit memory zeroing.
#
# Randomness comes from `getrandom` rather than `rand`: aes-gcm 0.10 pins
# rand_core 0.6 while rand 0.9 uses rand_core 0.9, and mixing them puts two
# incompatible OsRng types in scope. getrandom is the OS CSPRNG that rand's
# OsRng wraps anyway, so this is the same entropy with one less layer.
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = { version = "0.10.3", features = ["std"] }
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

[features]
# Enabled by `tauri dev`; keeps devtools out of release bundles.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
