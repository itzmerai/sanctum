[package]
name = "sanctum"
version = "0.1.0"
description = "Local-first, end-to-end encrypted vault for credentials, notes, tasks, calendar and income."
authors = ["Sanctum"]
edition = "2021"
rust-version = "1.77.2"

# The library target is what the integration tests and the binary both link
# against, so command logic stays testable without launching a window.
[lib]
name = "sanctum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
# Enabled by `tauri dev`; keeps devtools out of release bundles.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
