[package]
name = "sanctum"
version = "0.1.0"
description = "Local-first, end-to-end encrypted vault for credentials, notes, tasks, calendar and income."
authors = ["Sanctum"]
edition = "2021"
rust-version = "1.77.2"

# The library target is what the integration tests and the binary both link
# against, so command logic stays testable without launching a window.
[lib]
name = "sanctum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- crypto core (U2) -------------------------------------------------------
# Argon2id KDF, AES-256-GCM AEAD, and explicit memory zeroing.
#
# Randomness comes from `getrandom` rather than `rand`: aes-gcm 0.10 pins
# rand_core 0.6 while rand 0.9 uses rand_core 0.9, and mixing them puts two
# incompatible OsRng types in scope. getrandom is the OS CSPRNG that rand's
# OsRng wraps anyway, so this is the same entropy with one less layer.
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = { version = "0.10.3", features = ["std"] }
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# --- vault store (U3) --------------------------------------------------------
# Bundled SQLite so the shipped binary does not depend on a system library.
rusqlite = { version = "0.38", features = ["bundled"] }

# Native save/open dialogs for backup and CSV, and relaunch after a reset.
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

# --- website icons (U12) -----------------------------------------------------
# The only outbound request the app can make, and it is off by default.
# rustls rather than the platform TLS stack, so the trust decision is the same
# on every Windows image.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# --- session, recovery, strength (U4) ----------------------------------------
# HKDF is the fast KDF for the recovery code (KTD14): brute force is not the
# threat model at 150 bits of CSPRNG entropy, so Argon2 would only add latency.
hkdf = "0.12"
sha2 = "0.10"
zxcvbn = "3"

# --- clipboard (U7) ----------------------------------------------------------
# Raw FFI rather than the  wrapper crate: this needs six functions,
# and windows-sys changes its surface far less often.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[features]
# Enabled by `tauri dev`; keeps devtools out of release bundles.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
